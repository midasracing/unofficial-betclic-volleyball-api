name: Inspect VolleyStation public widget
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_volleystation.py'
      - '.github/workflows/volleystation.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public VolleyStation widget
        run: python -m tools.inspect_volleystation
      - name: Summarize detected API traffic
        if: always()
        run: |
          if [ -f captures/volleystation/inspection.json ]; then
            python - <<'PY'
          import json, os
          with open("captures/volleystation/inspection.json", encoding="utf-8") as f:
              report = json.load(f)
          lines = ["### VolleyStation diagnostics"]
          for widget in report.get("widgets", []):
              lines.append(f"- Page: {widget.get('page')} | HTTP: {widget.get('document_status')} | error: {widget.get('error')}")
              lines.append(f"  - Embedded iframes: {widget.get('iframes', [])}")
              interesting = [r for r in widget.get("requests", []) if r.get("type") in ("xhr", "fetch") or "websocket" in r]
              for request in interesting[:15]:
                  lines.append(f"  - {request.get('method', 'WS')} {request.get('status', '')} {request.get('url', request.get('websocket'))}")
          print("\\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\\n".join(lines) + "\\n")
          PY
          fi
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volleystation-widget-network
          path: captures/volleystation/
          retention-days: 3
          if-no-files-found: warn
