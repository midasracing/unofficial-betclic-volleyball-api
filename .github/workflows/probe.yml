name: Probe Betclic volleyball
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/probe_volleyball.py'
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Single Betclic volleyball probe
        run: python -m tools.probe_volleyball
