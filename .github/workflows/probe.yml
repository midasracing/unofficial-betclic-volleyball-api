name: Probe Betclic sports LIVE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_live_sports.py'
      - 'tools/probe_raw_live.py'
      - 'tools/capture_raw_protobuf.py'
      - 'requirements.txt'
      - 'app/betclic_scores.py'
      - 'app/main.py'
      - 'app/filters.py'
      - 'tests/test_scores.py'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies from source
        run: python -m pip install -r requirements.txt
      - name: Show installed Betclic package
        run: python -m pip show betclic-api
      - name: Run score decoder regression tests
        run: python -m pytest tests/test_scores.py tests/test_filters.py -q
      - name: Probe public Betclic events and odds
        run: python -m tools.probe_live_sports
      - name: Inspect raw event fields (volleyball and football)
        run: python -m tools.probe_raw_live
      - name: Capture original protobuf message bytes
        if: always()
        run: python -m tools.capture_raw_protobuf
      - name: Upload raw protobuf artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betclic-raw-protobuf
          path: captures/
          retention-days: 7
          if-no-files-found: warn
