name: Probe Betclic sports LIVE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_live_sports.py'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe public Betclic events and odds
        run: python -m tools.probe_live_sports
